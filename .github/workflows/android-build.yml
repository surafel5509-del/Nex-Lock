name: Android Build

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:
    inputs:
      run_instrumented_tests:
        description: 'Also run the instrumented tests on an emulator (slow)'
        type: boolean
        default: false

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # the workflow commits its own build log back to the branch
  actions: read

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m -Dkotlin.daemon.jvmargs=-Xmx2048m'
  NEXLOCK_CERT_SHA256: ${{ vars.NEXLOCK_CERT_SHA256 }}

jobs:
  build:
    name: Assemble APKs + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Toolchain report
        run: |
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_SDK_ROOT/platforms" || true

      - name: Assemble debug APK
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee ci-logs/assembleDebug.log

      - name: Assemble release APK
        # Signed with the release keystore only when its secrets exist; otherwise the Gradle
        # fallback signs with the debug key so the workflow works out of the box.
        run: |
          set -o pipefail
          mkdir -p ci-logs
          if [ -n "${{ secrets.NEXLOCK_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.NEXLOCK_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/nexlock-release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/nexlock-release.jks"
              echo "storePassword=${{ secrets.NEXLOCK_STORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.NEXLOCK_KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.NEXLOCK_KEY_PASSWORD }}"
            } > keystore.properties
          fi
          if [ -n "$NEXLOCK_CERT_SHA256" ]; then
            ./gradlew :app:assembleRelease --stacktrace --no-daemon \
              -Pnexlock.certSha256="$NEXLOCK_CERT_SHA256" 2>&1 | tee ci-logs/assembleRelease.log
          else
            ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee ci-logs/assembleRelease.log
          fi

      - name: JVM unit tests
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ./gradlew testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee ci-logs/unitTests.log

      - name: Surface compiler errors as annotations
        if: failure()
        run: |
          cat ci-logs/*.log 2>/dev/null | grep -E "^e: |error:|FAILURE:" | head -n 15 | while IFS= read -r line; do
            echo "::error title=Gradle::$line"
          done || true

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexlock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexlock-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexlock-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

      - name: Publish APKs to the rolling CI release
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          short_sha="${GITHUB_SHA::7}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/NexLock-debug-${short_sha}.apk" 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release.apk "dist/NexLock-release-${short_sha}.apk" 2>/dev/null || true
          ls -la dist
          gh release view nexlock-ci-latest >/dev/null 2>&1 \
            || gh release create nexlock-ci-latest \
                 --prerelease \
                 --title "NexLock CI build (latest)" \
                 --notes "Automatic debug and release APKs built by GitHub Actions from the newest commit. Release APK is debug-key signed unless signing secrets are configured." \
                 --target "$GITHUB_SHA"
          gh release upload nexlock-ci-latest dist/*.apk --clobber
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/tag/nexlock-ci-latest"

      - name: Commit the build log so failures can be inspected without the log host
        if: failure() && github.event_name == 'push'
        run: |
          if [ -z "$(ls -A ci-logs 2>/dev/null)" ]; then
            echo "No log produced"
            exit 0
          fi
          git config user.name "NexLock CI"
          git config user.email "nexlock-ci@users.noreply.github.com"
          git add -f ci-logs
          if git diff --cached --quiet; then
            echo "Log unchanged"
            exit 0
          fi
          git commit -m "ci: build log [skip ci]"
          git push

  instrumented:
    name: Instrumented tests (emulator, API 34)
    if: github.event_name == 'workflow_dispatch' && inputs.run_instrumented_tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            chmod +x ./gradlew
            ./gradlew :core-database:connectedDebugAndroidTest \
                      :core-security:connectedDebugAndroidTest \
                      :app:connectedDebugAndroidTest \
                      --stacktrace --no-daemon

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexlock-instrumented-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: ignore
